<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crewmate: show up for your friends</title>
<meta name="theme-color" content="#2563EB"><meta name="description" content="Post your plan, tick it off, and your friends see whether you showed up.">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Crewmate">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563EB;--yellow:#FACC15;--green:#34D399;--orange:#FB923C;--ink:#111827;--grey:#F3F4F6}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:0 24px 80px}
nav{display:flex;align-items:center;gap:8px;padding:20px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;margin-right:auto;text-decoration:none}
.tab{padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:700;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.btn{border:0;border-radius:99px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;font-size:15px}
.btn.blue{background:var(--blue)}.btn.light{background:var(--grey);color:var(--ink)}.btn.sm{padding:8px 14px;font-size:13px}
h1{font-size:44px;margin:12px 0 4px;letter-spacing:-1px}h2{font-size:26px;margin:0 0 16px}.muted{opacity:.65;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:24px}
.card{border-radius:32px;padding:28px;min-height:240px;position:relative}
.c0{background:var(--blue);color:#fff}.c1{background:var(--yellow)}.c2{background:var(--green)}.c3{background:var(--orange)}
.card.empty{background:#fff;border:3px dashed #d1d5db;color:#6b7280}
.who{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}
.pill{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800;background:rgba(0,0,0,.12)}
.big{font-size:84px;font-weight:800;letter-spacing:-4px;line-height:1;margin:14px 0 6px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:700;font-size:15px}
.task .box{width:26px;height:26px;border-radius:9px;border:3px solid currentColor;display:grid;place-items:center;flex:none;cursor:default;background:none;color:inherit;font:inherit;padding:0}
.task.mine .box{cursor:pointer}.task.done .box{background:var(--ink);border-color:var(--ink);color:#fff}.task.done span{text-decoration:line-through;opacity:.7}
.week{display:flex;gap:6px;margin-top:14px}.week i{width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.15)}
.week i.done{background:var(--ink)}.week i.missed{background:#fff;border:3px solid var(--ink)}.week i.today{background:transparent;border:3px dashed currentColor}
.panel{background:var(--grey);border-radius:32px;padding:28px;margin-top:20px}
input{font:inherit;font-weight:600;border:3px solid #e5e7eb;border-radius:16px;padding:12px 16px;width:100%;margin:6px 0 12px}
.row{display:flex;gap:10px}.row input{margin:0}
.stake{background:var(--orange);border-radius:32px;padding:28px;margin-top:20px}
.stakes{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stakes button{border:3px solid var(--ink);background:none;border-radius:99px;padding:10px 22px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.stakes button.on{background:var(--ink);color:#fff}
.banner{background:var(--yellow);border-radius:32px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.banner b{font-size:56px;letter-spacing:-2px}
.debt{border-radius:28px;padding:20px 24px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--orange)}.debt.paid{background:var(--green)}
.bar{height:22px;border-radius:99px;margin-top:6px}
.err{color:#b91c1c;font-weight:700;min-height:22px}
.auth{max-width:420px;margin:60px auto}
.hero{padding:40px 0}.hero p{font-size:20px;max-width:640px}
.share{background:var(--blue);color:#fff;border-radius:99px;padding:10px 18px;font-weight:800;font-size:14px;border:0;cursor:pointer}
.note{background:var(--yellow);border-radius:20px;padding:12px 18px;font-weight:700;margin:12px 0}.guide{background:var(--ink);color:#fff;border-radius:32px;padding:28px;margin:20px 0}.guide ol{margin:8px 0 0;padding-left:22px;font-weight:700;line-height:1.9}.small{font-size:13px}.doubt{border:0;background:rgba(0,0,0,.15);border-radius:99px;font:inherit;font-weight:800;font-size:11px;padding:3px 9px;cursor:pointer;color:inherit}.proof{font-size:12px;opacity:.8;font-weight:600;margin:-4px 0 4px 36px}
@keyframes pop{0%{transform:translate(-50%,30px) scale(.8);opacity:0}15%{transform:translate(-50%,0) scale(1.05);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:14px 26px;font-weight:800;font-size:17px;z-index:50;animation:pop 2.4s ease forwards;white-space:nowrap}
.toast.big{background:var(--blue);font-size:21px}
.confetti{position:fixed;top:30%;font-size:26px;z-index:49;animation:fall 1.8s ease-in forwards;pointer-events:none}
.av{display:inline-grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.2) center/cover no-repeat;color:#fff;font-weight:800;flex:none;border:3px solid rgba(255,255,255,.65)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.lvl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-top:6px;opacity:.9}
.xpbar{height:8px;border-radius:99px;background:rgba(0,0,0,.15);margin-top:4px;overflow:hidden}.xpbar i{display:block;height:100%;background:currentColor;border-radius:99px;opacity:.85}
.badges{font-size:20px;letter-spacing:2px;margin-top:8px;min-height:24px}
.quest{background:var(--grey);border-radius:24px;padding:16px 22px;margin-top:14px;font-weight:700}.quest .xpbar{height:12px;background:#e5e7eb}.quest .xpbar i{background:var(--green);opacity:1}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}.bg{border-radius:20px;padding:14px 16px;background:#fff;font-weight:700}.bg.off{opacity:.4;filter:grayscale(1)}.bg b{font-size:26px;display:block}
.stat{border-radius:32px;padding:24px}.stat b{font-size:56px;letter-spacing:-2px;display:block}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.55);display:grid;place-items:center;z-index:100;padding:20px}
.dlg{background:#fff;border-radius:28px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}.dlg p{font-weight:700;margin:0 0 10px;font-size:17px;line-height:1.4}.dlg input{margin:4px 0 14px}.dlg .row{justify-content:flex-end}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px 36px}
.rx{border:2px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);border-radius:99px;padding:2px 9px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;color:inherit}.rx.me{background:var(--ink);color:#fff;border-color:var(--ink)}.rx.ro{cursor:default}
.feed{background:var(--grey);border-radius:24px;padding:14px 22px;margin-top:14px;font-weight:700;font-size:14px}.feed div{padding:3px 0}.feed .ago{opacity:.55;font-weight:600}
.bell{position:relative}.bell b{background:#ef4444;color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;margin-left:4px}
.week i.frozen_missed,.week i.frozen_none{background:#bfdbfe;border:3px solid #60a5fa}
.frz{background:#dbeafe;color:#1e3a8a}
.inb{border-radius:20px;padding:14px 18px;margin-top:10px;background:var(--grey);font-weight:700}.inb.new{background:var(--yellow)}.inb .ago{opacity:.55;font-weight:600;font-size:13px}
.sec{margin-top:72px}.sec h2{font-size:34px;letter-spacing:-.5px;margin:0 0 6px}.sec .lead{font-size:18px;max-width:640px;margin:0 0 8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:24px}
.step{border-radius:32px;padding:26px;min-height:230px}.step .num{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1}.step h3{font-size:21px;margin:10px 0 6px}.step p{margin:0;font-weight:600;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:24px}.two ul{margin:10px 0 0;padding-left:20px;font-weight:700;line-height:1.9}
.faq{background:var(--grey);border-radius:24px;padding:18px 24px;margin-top:12px}.faq summary{font-weight:800;font-size:17px;cursor:pointer}.faq p{margin:10px 0 0;font-weight:600;line-height:1.5;max-width:720px}
.cta{background:var(--ink);color:#fff;border-radius:32px;padding:44px 32px;text-align:center}.cta h2{font-size:34px;margin:0 0 8px}
@media(max-width:600px){h1{font-size:32px}.sec h2,.cta h2{font-size:26px}.sec{margin-top:48px}}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.plan{border-radius:32px;padding:32px}.plan .pt{font-weight:800;font-size:20px;display:flex;align-items:center}.plan .pp{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;margin:8px 0 2px}
.pl{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:16px;line-height:1.35}.pl .ck{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.sub{font-weight:600;opacity:.65;font-size:14px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const $app=document.getElementById('app');
let me=null,groups=[],timer=null;
const esc=s=>String(s).replace(/~[a-f0-9]{6}$/,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=n=>esc([...String(n).replace(/~[a-f0-9]{6}$/,'')][0]||'?').toUpperCase();
const av=(m,sz=46)=>`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;${m.avatar?`background-image:url(${m.avatar})`:''}">${m.avatar?'':initial(m.name)}</span>`;
const lvlRow=m=>{const pct=m.xpNext?Math.round(100*(m.xp-m.xpFloor)/(m.xpNext-m.xpFloor)):100;return `<div class="lvl"><span>Lv ${m.level} ${esc(m.levelName)}</span><span>${m.xp} XP</span></div><div class="xpbar"><i style="width:${pct}%"></i></div>`};
let lastXp={};
function toast(msg,big){const t=document.createElement('div');t.className='toast'+(big?' big':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
  if(big){for(let i=0;i<28;i++){const c=document.createElement('div');c.className='confetti';c.textContent=['🎉','✨','⭐','🔥','💎'][i%5];c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}}
async function api(path,body){
  const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
let tgInfo={},unread=0,lastUnread=null;
function dlg(msg,o={}){return new Promise(done=>{const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><p>${esc(msg)}</p>${o.input?`<input id="dlgi" placeholder="${esc(o.ph||'')}" value="${esc(o.value||'')}" maxlength="${o.max||200}">`:''}<div class="row">${o.cancel===false?'':'<button class="btn light sm" data-k="0">Cancel</button>'}<button class="btn blue sm" data-k="1">${esc(o.ok||'OK')}</button></div></div>`;
  const inp=ov.querySelector('input'),fin=ok=>{document.removeEventListener('keydown',kd);ov.remove();done(ok?(o.input?inp.value:true):(o.input?null:false))};
  const kd=e=>{if(e.key==='Escape'&&o.cancel!==false)fin(false);if(e.key==='Enter')fin(true)};
  ov.addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k==='1')fin(true);else if(k==='0'||(e.target===ov&&o.cancel!==false))fin(false)});
  document.addEventListener('keydown',kd);document.body.appendChild(ov);(inp||ov.querySelector('[data-k="1"]')).focus()})}
const ask=(msg,o={})=>dlg(msg,{...o,input:true}),confirmBox=(msg,ok)=>dlg(msg,{ok:ok||'Yes'}),say=msg=>dlg(msg,{cancel:false});
const ago=at=>{const m=Math.max(0,Math.round((Date.now()-at)/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const shareUrl=(k,v)=>location.origin+'/'+k+'/'+v;
async function boot(){const j=await api('me');me=j.user;groups=j.groups||[];tgInfo=j.telegram||{};unread=j.unread||0;try{pushSt=await pushState()}catch{}render()}
(function(){const m=/^\/(join|r)\/([A-Za-z0-9]+)$/.exec(location.pathname);if(m)history.replaceState(null,'','/#/'+m[1]+'/'+m[2])})();
window.addEventListener('hashchange',render);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
function go(h){location.hash=h}
function nav(gid,active){
  const t=(k,l)=>`<a class="tab ${active===k?'on':''}" href="#/g/${gid}${k==='wall'?'':'/'+k}">${l}</a>`;
  return `<nav><a class="logo" href="#/">Crewmate</a>${gid?t('wall','Group wall')+t('plan','My plan')+t('ledger','Stakes')+t('recap','Recap')+t('plus','Plus'):''}
  ${me?`<a class="btn light sm bell" style="text-decoration:none" href="#/inbox" title="Notifications">🔔${unread?`<b>${unread}</b>`:''}</a><a class="btn light sm" style="text-decoration:none" href="#/account">${esc(me.name)} · account</a>`:''}</nav>`;
}
async function logout(){await pushOff(true);await api('logout',{});me=null;groups=[];go('#/');render()}
function clearTimer(){if(timer){clearInterval(timer);timer=null}}

async function render(){
  clearTimer();
  const h=location.hash.replace(/^#/,'')||'/';
  const inv=/^\/join\/(\w+)/.exec(h);
  const sr=/^\/r\/([a-f0-9]+)/.exec(h);
  if(sr)return sharedView(sr[1]);
  if(h==='/recover'&&!me)return recoverView();
  if(!me){ if(inv){sessionStorage.setItem('invite',inv[1]);let nm='';try{const i=await api('invite/'+inv[1]);nm=`You're invited to ${i.name} (${i.members} ${i.members==1?'friend':'friends'} so far).${i.min_stake?` Crew rule: at least $${i.min_stake} a day.`:''}${i.challenge?` Crew challenge: ${i.challenge.title}, $${i.challenge.stake} each.`:''} Create an account to join.`}catch(e){nm=e.message}return authView('form','',nm)} return authView(h==='/'?'landing':'form'); }
  const pend=sessionStorage.getItem('invite');
  if(pend){sessionStorage.removeItem('invite');return joinNow(pend)}
  if(inv)return joinNow(inv[1]);
  if(h==='/account')return account();
  if(h==='/inbox')return inbox();
  const g=/^\/g\/(\d+)(?:\/(\w+))?/.exec(h);
  if(g){const gid=g[1],page=g[2]||'wall';return Promise.resolve(({wall,plan,ledger,recap,plus,challenge}[page]||wall)(gid)).catch(e=>{$app.innerHTML=nav()+`<p class="err">${esc(e.message)}</p>`})}
  home();
}
async function joinNow(code){try{const j=await api('join',{code});await boot0();go('#/g/'+j.id)}catch(e){$app.innerHTML=nav()+`<p class="err">${esc(e.message)}</p>`}}
async function boot0(){const j=await api('me');groups=j.groups}

function authView(mode,err='',note=''){
  if(mode==='landing'&&!err){
    $app.innerHTML=`<nav><a class="logo" href="#/">Crewmate</a><button class="btn light sm" onclick="authView('form')">Log in</button></nav>
    <div class="hero"><h1>You never skip the flight you paid for.<br>You skip the 6 a.m. run that cost nothing.</h1>
    <p class="muted">Set a challenge with your friends and everyone who's in puts a few dollars on it. Show up and it costs you nothing. Skip it and you owe the crew.</p>
    <p><button class="btn blue" onclick="authView('form')">Set a challenge</button> <a class="btn light" style="text-decoration:none;display:inline-block" href="#how" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'});return false">How it works</a></p>
    <p class="small" style="font-weight:700">Crewmate never holds the money and never takes a cut. Stakes stay between you and your friends.</p></div>
    <div class="stake" style="margin-top:0"><div class="small" style="font-weight:800;opacity:.7;letter-spacing:1px">CREW CHALLENGE · TUESDAY, 6:20 AM</div><b style="font-size:28px">6 a.m. run</b>
    <div style="font-weight:700;margin-top:4px">every Tue, Thu · check-in 5:45 AM to 6:15 AM · <b>$5 each</b></div></div>
    <div class="grid"><div class="card c0"><div class="who">Dana <span class="pill">🔥 21-day streak</span></div><div class="big">✓</div><b>Checked in at 5:58 AM</b></div>
    <div class="card c2"><div class="who">Marcus <span class="pill">🔥 4-day streak</span></div><div class="big">✓</div><b>Checked in at 6:07 AM</b></div>
    <div class="card empty"><div class="who">Jess <span class="pill">missed</span></div><div class="big">$5</div><b>Slept in. Owes the crew.</b></div></div>

    <div class="sec" id="how"><h2>How it works</h2><p class="muted lead">Four steps, about a minute to set up, nothing to install.</p>
    <div class="steps">
      <div class="step c0"><div class="num">1</div><h3>Set a challenge</h3><p>Say what, when and how much: "6 a.m. run, Tuesday and Thursday, $5 each." It can run every day, on chosen days, or just once.</p></div>
      <div class="step c1"><div class="num">2</div><h3>Send the link</h3><p>Friends open it and tap "I'm in". Nothing is on you until you agree. Once you're in, money is on it, and everyone sees who hasn't answered.</p></div>
      <div class="step c2"><div class="num">3</div><h3>Show up and check in</h3><p>Tick it off when you've done it. If the crew wants proof, the tick only works near the agreed time, or asks for a photo.</p></div>
      <div class="step c3"><div class="num">4</div><h3>Skip it, owe the crew</h3><p>Once you're in, a missed day lands on the crew's tab, even if you never open the app. Pay your friends back and one of them marks it settled.</p></div>
    </div></div>

    <div class="sec"><h2>Why it works</h2><p class="muted lead">The difference between what you skip and what you don't isn't willpower. One of them already cost you something.</p>
    <div class="two">
      <div class="panel" style="margin-top:0"><b style="font-size:20px">You never skip</b><ul><li>The flight you paid $300 for</li><li>The concert you bought tickets to</li><li>The class with a no-show fee</li></ul></div>
      <div class="panel" style="margin-top:0;background:var(--yellow)"><b style="font-size:20px">You always skip</b><ul><li>The 6 a.m. run with friends</li><li>"Let's hit the gym on Monday"</li><li>"I'll study tonight, promise"</li></ul></div>
    </div>
    <p style="font-weight:800;font-size:20px;margin:24px 0 0">Crewmate gives the free promise a price, and puts your friends on the other side of it.</p></div>

    <div class="sec"><h2>Where does the money go?</h2><p class="muted lead">Never to us.</p>
    <div class="two">
      <div class="panel" style="margin-top:0"><b style="font-size:20px">Stakes stay between friends</b><p style="font-weight:600;line-height:1.5">Crewmate keeps the tab: who skipped, how much, and whether it's settled. You pay each other the way you already do, and a friend confirms it. We never hold the money and never take a cut.</p></div>
      <div class="panel" style="margin-top:0"><b style="font-size:20px">We charge for the crew, not the pot</b><p style="font-weight:600;line-height:1.5">Free covers you and one friend, one challenge at a time and stakes up to $5. Plus is one subscription for the whole crew: as many friends as you like, more challenges and bigger stakes.</p></div>
    </div></div>

    <div class="sec"><h2>Questions</h2>
      <details class="faq"><summary>What if someone ticks it without doing it?</summary><p>Friends can doubt a tick. When money is on the day and most of the crew doubts it (at least two people), it counts as a miss. You can also ask for proof: a check-in window around the agreed time, a photo, or both.</p></details>
      <details class="faq"><summary>Is this betting?</summary><p>No. Nobody wins money by guessing an outcome. You set a price on your own promise, and you only pay it if you break it.</p></details>
      <details class="faq"><summary>What if I have a bad day?</summary><p>One streak freeze a week keeps your streak alive. The stake still counts, because that is the whole point.</p></details>
      <details class="faq"><summary>Do I need to install anything?</summary><p>No. It runs in the browser on your phone or laptop. You can add it to your home screen if you like.</p></details>
    </div>

    <div class="sec cta"><h2>What do you and your friends keep skipping?</h2><p style="font-weight:600;opacity:.8;margin:0 0 20px">Put $5 on it and find out who shows up.</p><button class="btn blue" onclick="authView('form')">Set a challenge</button></div>`;return;
  }
  $app.innerHTML=`<nav><a class="logo" href="#/">Crewmate</a></nav><div class="auth"><h2 id="t">Welcome</h2>${note?`<p style="font-weight:700">${esc(note)}</p>`:''}
  <input id="n" placeholder="Your name" autocomplete="username"><input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <p class="err" id="e">${esc(err)}</p>

function pickPhoto(){return new Promise(done=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';
  i.oncancel=()=>done(null);
  i.onchange=()=>{const f=i.files[0];if(!f)return done(null);const rd=new FileReader();rd.onerror=()=>done(null);
    rd.onload=()=>{const img=new Image();img.onerror=()=>done(null);
      img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',0.6))};

    rd.readAsDataURL(f)};

    <div class="row" style="margin-top:14px"><input id="tt" placeholder="e.g. Finish lesson 4" onkeydown="if(event.key==='Enter')addTask('${gid}')"><button class="btn blue" onclick="addTask('${gid}')">Add</button></div>
    <div class="small" style="margin-top:10px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap">Optional proof for this task: <span>check-in time <input id="td" type="time" style="width:auto;margin:0;padding:6px 10px"></span><label><input id="tp" type="checkbox" style="width:auto;margin:0 6px 0 0">photo</label></div><p class="err" id="e"></p></div>
  <div class="stake"><h2 style="margin:0">Put money on it</h2><div>If I don't finish everything today, I owe the group (default $2):</div>
    <div class="stakes">${[0,2,5].map(a=>`<button class="${m.stake===a?'on':''}" ${(a<m.stake&&!m.canLower)||a<Math.max(d.group.min_stake,d.group.stakeFloor||0)?'disabled style="opacity:.35;cursor:default"':''} onclick="setStake(${a},'${gid}')">${a?'$'+a:'None'}</button>`).join('')}${d.group.plus?`<button class="${m.stake===10?'on':''}" ${10<m.stake?'disabled style="opacity:.35"':''} onclick="setStake(10,'${gid}')">$10</button><button onclick="customStake('${gid}')">Custom</button>`:`<button onclick="go('#/g/${gid}/plus')">$6+ · Plus</button>`}</div>
    <p style="font-weight:800">${m.stake?(m.canLower?`$${m.stake} is on today by default. For the next few minutes, before you tick anything, you can change it${d.group.min_stake?` (this crew requires at least $${d.group.min_stake})`:' or pick None'}. After that the plan is locked and the stake can only go up.`:`$${m.stake} is on today. Your plan is locked: you can add tasks, not remove them, and the stake can only go up.`):d.group.min_stake?`This crew requires at least $${d.group.min_stake} a day. It goes on when you add your first task.`:m.tasks.length?'No bet today. You can put one on any time; once money is on, the plan is locked and the stake can only go up.':'A small bet goes on automatically when you add your first task. You can switch it to None for a few minutes. After that the plan is locked and the stake can only go up.'} The day ends at midnight, ${esc(d.group.tz.replace(/_/g,' '))} time.</p>
    <p class="muted" style="color:var(--ink)">Crewmate doesn't move money. It keeps the tab, and you settle up with your friends yourselves.</p></div>`;
}
const again=(gid)=>plan(gid);
async function addTask(gid){try{await api(`groups/${gid}/tasks`,{title:tt.value,due:td.value||null,photo:tp.checked});plan(gid)}catch(e){document.getElementById('e').textContent=e.message}}

async function renameTask(id,gid,old){const v=await ask('Edit task:',{value:old,ok:'Save',max:80});if(v===null||!v.trim())return;try{await api(`tasks/${id}/rename`,{title:v})}catch(e){say(e.message)}plan(gid)}
async function delTask(id,gid){try{await api(`tasks/${id}/delete`,{})}catch(e){say(e.message)}plan(gid)}

async function plus(gid){
  const d=await api(`groups/${gid}/wall`),g=d.group,n=d.members.length;
  const li=(a,b)=>`<div class="pl"><span class="ck">✓</span><span><b>${a}</b>${b?`<br><span class="sub">${b}</span>`:''}</span></div>`;
  const action=g.plus?'<div class="pill" style="background:var(--yellow);color:var(--ink);font-size:15px;padding:10px 18px">This crew is on Plus ✓</div>'
    :g.checkout?`<a class="btn" style="text-decoration:none;display:inline-block;background:var(--yellow);color:var(--ink);font-size:17px;padding:14px 28px" href="${esc(g.checkout)}">Upgrade ${esc(g.name)}</a>`
    :'<div class="sub">Checkout opens soon. Everything in Free works today.</div>';
  $app.innerHTML=nav(gid,'plus')+`<div class="hero" style="padding:24px 0 8px"><h1>One subscription.<br>The whole crew.</h1>
  <p class="muted" style="margin:10px 0 0">One person upgrades and everyone in ${esc(g.name)} gets Plus. We charge for the crew, never a cut of the stakes.</p></div>
  <div class="plans">
    <div class="plan" style="background:var(--grey)"><div class="pt">Free</div><div class="pp">$0</div><div class="sub" style="margin-bottom:18px">For a crew that is just getting started</div>
      ${li(g.freeMembers==2?'You and one friend':'A crew of '+g.freeMembers)}${li('One crew challenge at a time')}${li('Stakes up to $5')}${li('1 streak freeze a week')}${li('Wall, tab and weekly recap')}
      ${g.plus?'':'<div class="pill" style="margin-top:18px">Your crew is here</div>'}</div>
    <div class="plan" style="background:var(--ink);color:#fff"><div class="pt">Plus <span class="pill" style="background:var(--yellow);color:var(--ink);margin-left:8px">covers everyone</span></div><div class="pp">${g.price?esc(g.price):'$5<span style="font-size:20px;letter-spacing:0;opacity:.7"> / month</span>'}</div><div class="sub" style="margin-bottom:18px">For a crew that means it</div>
      ${li('Unlimited friends','Your crew has '+n+(n==1?' person':' people')+' now')}${li('Unlimited crew challenges','Run the 6 a.m. run and the gym days at once')}${li('Stakes up to $50','For promises that need a real price')}${li('3 streak freezes a week')}${li('Everything in Free')}
      <div style="margin-top:22px">${action}</div></div>
  </div>
  <div class="panel" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="font-size:40px">🤝</div><div style="flex:1;min-width:240px"><b style="font-size:19px">The stakes are never ours</b><div class="muted" style="margin-top:4px">Money lost on a skipped day goes to your friends, not to Crewmate. We don't hold it and we don't take a cut. Plus is the only thing we sell, and Stripe handles the payment.</div></div></div>`;
}
async function customStake(gid){const r=await ask('Stake in dollars (1-50):',{ok:'Set stake',ph:'e.g. 20'});const v=parseInt(r,10);if(v)setStake(v,gid)}
async function setStake(a,gid){try{await api(`groups/${gid}/stake`,{amount:a})}catch(e){say(e.message)}plan(gid)}

async function ledger(gid){
  const d=await api(`groups/${gid}/ledger`);
  $app.innerHTML=nav(gid,'ledger')+`<h1>Stakes</h1><div class="banner"><div><b>$${d.openTotal}</b><div style="font-weight:800">owed to the group, still open</div></div></div>
  ${d.debts.map(x=>`<div class="debt ${x.paid?'paid':''}"><div><b style="font-size:20px">${x.user_id===d.me?'You':esc(x.name)}</b> missed ${x.day}<br><span class="muted" style="color:var(--ink)">$${x.amount} ${x.paid?'· paid, confirmed by '+esc(x.paid_by||'a friend'):''}</span></div>
  ${!x.paid&&x.user_id!==d.me?`<button class="btn sm" onclick="markPaid(${x.id},'${gid}')">Mark as paid</button>`:x.paid?'<b>Settled ✓</b>':'<span class="pill">Waiting for a friend to confirm</span>'}</div>`).join('')||'<p class="muted">No stakes lost yet. Everyone is on track.</p>'}`;
}
async function markPaid(id,gid){await api(`debts/${id}/paid`,{});ledger(gid)}

async function recap(gid){
  const d=await api(`groups/${gid}/recap`),pct=d.totalDays?Math.round(100*d.totalDone/d.totalDays):0,max=Math.max(1,...d.members.map(m=>m.done));
  const cols=['var(--blue)','var(--yellow)','var(--green)','var(--orange)'];
  $app.innerHTML=nav(gid,'recap')+`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px"><h1>Last 7 days</h1><button class="share" onclick="shareRecap('${gid}',this)">Share recap link</button></div><div class="grid" style="margin-top:8px">
  <div class="stat c2"><b>${d.totalDone}</b>days fully done</div><div class="stat c3"><b>$${d.pot}</b>lost to stakes</div><div class="stat c0"><b>${pct}%</b>of all days completed</div></div>
  <div class="panel"><h2>Leaderboard</h2>${d.members.map((m,i)=>`<div style="margin-top:14px"><b>${i+1}. ${esc(m.name)}</b> · Lv ${m.level} ${esc(m.levelName)} · ${m.done} done, ${m.missed} missed · ${m.streak}-day streak<div class="bar" style="width:${Math.max(4,100*m.done/max)}%;background:${cols[i%4]}"></div></div>`).join('')}</div>`;
}
async function shareRecap(gid,b){try{const j=await api(`groups/${gid}/share`,{});try{await navigator.clipboard.writeText(shareUrl('r',j.token))}catch{}b.textContent='Link copied'}catch(e){say(e.message)}}
async function sharedView(tok){
  let d;try{d=await api('shared/'+tok)}catch(e){$app.innerHTML=`<nav><a class="logo" href="#/">Crewmate</a></nav><p class="err">${esc(e.message)}</p>`;return}
  const pct=d.totalDays?Math.round(100*d.totalDone/d.totalDays):0,max=Math.max(1,...d.members.map(m=>m.done)),cols=['var(--blue)','var(--yellow)','var(--green)','var(--orange)'];
  $app.innerHTML=`<nav><a class="logo" href="#/">Crewmate</a></nav><h1>${esc(d.group)}: last 7 days</h1><div class="grid" style="margin-top:8px">
  <div class="stat c2"><b>${d.totalDone}</b>days fully done</div><div class="stat c3"><b>$${d.pot}</b>lost to stakes</div><div class="stat c0"><b>${pct}%</b>of all days completed</div></div>
  <div class="panel"><h2>Leaderboard</h2>${d.members.map((m,i)=>`<div style="margin-top:14px"><b>${i+1}. ${esc(m.name)}</b> · ${m.done} done, ${m.missed} missed · ${m.streak}-day streak<div class="bar" style="width:${Math.max(4,100*m.done/max)}%;background:${cols[i%4]}"></div></div>`).join('')}</div>
  <p><a class="btn blue" style="text-decoration:none" href="#/">Start your own crew</a></p>`;
}
async function inbox(){
  const j=await api('notifications');
  $app.innerHTML=nav()+`<h1>Notifications</h1>${j.items.map(n=>`<div class="inb ${n.read?'':'new'}">${esc(n.text)}<div class="ago">${esc(n.group_name||'')} · ${ago(n.at)}</div></div>`).join('')||'<p class="muted">Nothing yet. When friends finish tasks, you will see it here.</p>'}`;
  if(j.unread){await api('notifications/read',{});unread=0;lastUnread=0;const b=document.querySelector('.bell b');if(b)b.remove()}
}
async function setNotify(on){try{await api('notify',{telegram:on});tgInfo.notify=on;account()}catch(e){say(e.message)}}
async function uploadAvatar(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>say('Could not read that file');
  rd.onload=()=>{const img=new Image();
    img.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
      try{await api('avatar',{image:c.toDataURL('image/jpeg',0.8)});account()}catch(e){say(e.message)}};
    img.onerror=()=>say('Could not read that image');img.src=rd.result};
  rd.readAsDataURL(f);
}
async function rmAvatar(){await api('avatar/remove',{});account()}
async function account(){
  const t=tgInfo||{},pr=await api('profile'),pm={name:me.name,avatar:pr.avatar},pct=pr.next?Math.round(100*(pr.xp-pr.floor)/(pr.next-pr.floor)):100;
  $app.innerHTML=nav()+`<h1>Account</h1>
  <div class="panel"><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">${av(pm,84)}<div style="flex:1;min-width:200px"><h2 style="margin:0">${esc(me.name)}</h2><div class="lvl" style="opacity:1"><span>Lv ${pr.level} ${esc(pr.levelName)}</span><span>${pr.xp} XP${pr.next?` · ${pr.next-pr.xp} to next level`:' · max level'}</span></div><div class="xpbar" style="height:12px"><i style="width:${pct}%;background:var(--blue);opacity:1"></i></div></div></div>
    <p style="margin:14px 0 6px"><label class="btn light sm" style="cursor:pointer">Upload a photo<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"></label> ${pr.avatar?'<button class="btn light sm" onclick="rmAvatar()">Remove photo</button>':''}</p>
    <h2 style="margin-top:22px">Badges (${pr.badges.filter(b=>b.earned).length}/${pr.badges.length})</h2><div class="bgrid">${pr.badges.map(b=>`<div class="bg ${b.earned?'':'off'}"><b>${b.emoji}</b>${esc(b.name)}<div class="small muted">${esc(b.desc)}</div></div>`).join('')}</div>
    <p class="small muted" style="margin-top:14px">XP: 10 per ticked task (max 5 tasks a day count), 25 per fully finished day, 15 more when money was on it, 3 per nudge or cheer (max 30).</p></div><div class="panel"><h2>Change password</h2><input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (6+ characters)"><p class="err" id="e"></p><button class="btn blue" onclick="chPw()">Save</button></div>
  <div class="panel"><h2>Notifications</h2><p class="muted">A reminder before your check-in opens, a heads-up in the evening when money is still on the line, and a note when a friend shows up or skips.</p>${pushSt==='on'?'<p><b>On for this device ✓</b></p><button class="btn light" onclick="pushOff()">Turn off</button>':pushSt==='off'?'<button class="btn blue" onclick="pushOn()">Turn on notifications</button>':pushSt==='denied'?'<p><b>Notifications are blocked for this site.</b> Allow them in your browser settings for this site, then reload.</p>':'<p><b>This browser cannot show notifications.</b> On iPhone, add Crewmate to your home screen first, then open it from there.</p>'}</div>
  ${t.enabled?`<div class="panel"><h2>Telegram reminders</h2><p class="muted">Get a message when a plan is unfinished in the evening, when a friend nudges you, and when friends finish tasks.</p>${t.linked?`<p><b>Connected ✓</b></p><p><label style="font-weight:700"><input type="checkbox" style="width:auto;margin:0 8px 0 0" ${t.notify!==false?'checked':''} onchange="setNotify(this.checked)">Message me when a friend finishes a task</label></p><button class="btn light" onclick="tgUnlink()">Disconnect</button>`:`<button class="btn blue" onclick="tgLink()">Connect Telegram</button>`}</div>`:''}
  <div class="panel"><h2>Recovery code</h2><p class="muted">Make a new code if you lost yours or your account has none. The old one stops working.</p><input id="rp" type="password" placeholder="Your password"><button class="btn light" onclick="newRec()">Make a new recovery code</button></div>
  <div class="panel"><button class="btn light" onclick="logout()">Log out</button></div>`;
}
async function chPw(){try{await api('password',{old:op.value,password:np.value});await say('Password changed.');go('#/')}catch(e){document.getElementById('e').textContent=e.message}}
async function newRec(){try{const j=await api('recovery/new',{password:rp.value});await say('Your new recovery code, shown once. Write it down: '+j.recovery)}catch(e){say(e.message)}}
async function tgLink(){try{const j=await api('telegram/link',{});window.open(j.link,'_blank');say('Press Start in Telegram, then come back and refresh.')}catch(e){say(e.message)}}
async function tgUnlink(){await api('telegram/unlink',{});await boot();go('#/account')}
boot();
</script></body></html>
